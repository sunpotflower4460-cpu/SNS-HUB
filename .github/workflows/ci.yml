name: SNS-HUB CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sns-hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install declared dependencies
        run: npm install --no-audit --no-fund
      - name: Full repository gate
        run: npm run ci
